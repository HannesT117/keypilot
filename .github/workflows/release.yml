name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Check for releasable commits
        id: check
        run: |
          DOMINATED='(docs|chore|style|ci):'
          DOMINATED_COUNT=0
          TOTAL=0
          while IFS= read -r msg; do
            TOTAL=$((TOTAL + 1))
            if echo "$msg" | grep -qE "^$DOMINATED"; then
              DOMINATED_COUNT=$((DOMINATED_COUNT + 1))
            fi
          done <<'COMMITS'
          ${{ join(github.event.commits.*.message, '
          ') }}
          COMMITS
          if [ "$TOTAL" -eq "$DOMINATED_COUNT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "All $TOTAL commit(s) are housekeeping — skipping release"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Found releasable commits ($((TOTAL - DOMINATED_COUNT))/$TOTAL)"
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Build and sign KeyPilot.app
        if: steps.check.outputs.skip != 'true'
        run: make sign

      - name: Zip app bundle
        if: steps.check.outputs.skip != 'true'
        run: zip -r KeyPilot.app.zip KeyPilot.app

      - name: Generate release tag
        if: steps.check.outputs.skip != 'true'
        id: tag
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated tag: $TAG"

      - name: Create GitHub Release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: KeyPilot ${{ steps.tag.outputs.tag }}
          body: |
            Automated build from commit ${{ github.sha }}.

            **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          files: KeyPilot.app.zip
